<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="open-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" />
    </marker>
  </defs>

  <!-- Main Title -->
  <text x="640" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000" letter-spacing="1">
    INTEGRATED INVENTORY AND SALES MANAGEMENT SYSTEM
  </text>
  <text x="640" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">
    [ UML USE CASE DIAGRAM: AUTHENTICATION &amp; ROLE-BASED ACCESS CONTROL ]
  </text>
  <text x="640" y="76" text-anchor="middle" font-size="11" fill="#666666">
    Implementation Reference: App\Http\Controllers\AuthController.php
  </text>

  <!-- System Boundary Box -->
  <rect x="230" y="90" width="820" height="800" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="255" y="118" font-size="13" font-weight="bold" fill="#000000">Subsystem Boundary: Authentication &amp; Multi-Role Redirection</text>

  <!-- ================= ACTOR 1: GENERAL USER / GUEST [TOP LEFT] ================= -->
  <g transform="translate(90, 200)">
    <circle cx="25" cy="0" r="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="16" x2="25" y2="65" stroke="#000000" stroke-width="2.5"/>
    <line x1="-5" y1="35" x2="55" y2="35" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="0" y2="110" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="50" y2="110" stroke="#000000" stroke-width="2.5"/>
    <text x="25" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">GUEST / USER</text>
    <text x="25" y="148" text-anchor="middle" font-size="10.5" fill="#333333">(LOGIN INITIATOR)</text>
  </g>

  <!-- ================= ACTOR 2: OWNER (MASTER ADMIN) [BOTTOM LEFT] ================= -->
  <g transform="translate(90, 680)">
    <circle cx="25" cy="0" r="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="16" x2="25" y2="65" stroke="#000000" stroke-width="2.5"/>
    <line x1="-5" y1="35" x2="55" y2="35" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="0" y2="110" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="50" y2="110" stroke="#000000" stroke-width="2.5"/>
    <text x="25" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">OWNER</text>
    <text x="25" y="148" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">(MASTER ADMIN)</text>
  </g>

  <!-- ================= ACTOR 3: SUPPLIER (SUP 1 & 2) [TOP RIGHT] ================= -->
  <g transform="translate(1140, 200)">
    <circle cx="25" cy="0" r="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="16" x2="25" y2="65" stroke="#000000" stroke-width="2.5"/>
    <line x1="-5" y1="35" x2="55" y2="35" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="0" y2="110" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="50" y2="110" stroke="#000000" stroke-width="2.5"/>
    <text x="25" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">SUPPLIER</text>
    <text x="25" y="148" text-anchor="middle" font-size="10.5" fill="#333333">(SUPPLIER 1 &amp; 2)</text>
  </g>

  <!-- ================= ACTOR 4: TRANSFER OFFICERS [BOTTOM RIGHT] ================= -->
  <g transform="translate(1140, 680)">
    <circle cx="25" cy="0" r="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="16" x2="25" y2="65" stroke="#000000" stroke-width="2.5"/>
    <line x1="-5" y1="35" x2="55" y2="35" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="0" y2="110" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="50" y2="110" stroke="#000000" stroke-width="2.5"/>
    <text x="25" y="132" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">TRANSFER</text>
    <text x="25" y="148" text-anchor="middle" font-size="10.5" fill="#333333">OFFICERS</text>
  </g>

  <!-- ================= COLUMN 1: PRIMARY AUTHENTICATION USE CASES ================= -->

  <!-- 1. Submit Login Form -->
  <g transform="translate(410, 190)">
    <ellipse cx="0" cy="0" rx="115" ry="26" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">Authenticate /</text>
    <text x="0" y="12" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">Submit Login</text>
  </g>

  <!-- 2. Terminate Session / Logout -->
  <g transform="translate(410, 310)">
    <ellipse cx="0" cy="0" rx="115" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="600" fill="#000000">Terminate Session / Logout</text>
  </g>

  <!-- ================= COLUMN 2: SECURITY & VALIDATION INCLUSIONS ================= -->

  <!-- Include 1: Rate Limiting Lockout -->
  <g transform="translate(730, 140)">
    <ellipse cx="0" cy="0" rx="100" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="#000000">Enforce Rate Limiting</text>
  </g>

  <!-- Include 2: Validate Request Credentials -->
  <g transform="translate(730, 190)">
    <ellipse cx="0" cy="0" rx="105" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="#000000">Validate Format (Email/Pwd)</text>
  </g>

  <!-- Include 3: Verify Password Hash & Regenerate Session -->
  <g transform="translate(730, 240)">
    <ellipse cx="0" cy="0" rx="110" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="#000000">Verify Hash &amp; Regenerate Session</text>
  </g>

  <!-- ================= ROLE-BASED PORTAL ROUTING USE CASES (LINES 32-39 & 88-101) ================= -->

  <!-- Portal 1: Master Admin Dashboard -->
  <g transform="translate(410, 470)">
    <ellipse cx="0" cy="0" rx="125" ry="26" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">Access Master Admin</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">Executive Dashboard</text>
  </g>

  <!-- Portal 2: Supplier Operations Dashboard -->
  <g transform="translate(860, 470)">
    <ellipse cx="0" cy="0" rx="125" ry="26" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Access Supplier Tenant</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Operations Portal</text>
  </g>

  <!-- Portal 3: Windows & Doors Transfer Station -->
  <g transform="translate(410, 600)">
    <ellipse cx="0" cy="0" rx="125" ry="26" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">Access Windows &amp; Doors</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">Transfer Station</text>
  </g>

  <!-- Portal 4: Roofing Materials Transfer Station -->
  <g transform="translate(860, 600)">
    <ellipse cx="0" cy="0" rx="125" ry="26" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">Access Roofing Materials</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">Transfer Station</text>
  </g>

  <!-- Portal 5: Database Seeder Fallback -->
  <g transform="translate(640, 750)">
    <ellipse cx="0" cy="0" rx="125" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <text x="0" y="4" text-anchor="middle" font-size="10.5" fill="#000000">Auto-Seed Supplier Data On-the-Fly</text>
  </g>

  <!-- ================= SOLID ASSOCIATION LINES ================= -->

  <!-- Guest / User -> Submit Login -->
  <line x1="145" y1="230" x2="295" y2="190" stroke="#000000" stroke-width="2"/>

  <!-- Master Admin -> Logout & Portal -->
  <line x1="145" y1="710" x2="310" y2="470" stroke="#0284c7" stroke-width="2"/>
  <line x1="145" y1="700" x2="310" y2="315" stroke="#000000" stroke-width="1.8"/>

  <!-- Supplier -> Portal & Logout -->
  <line x1="1135" y1="230" x2="985" y2="470" stroke="#16a34a" stroke-width="2"/>
  <line x1="1135" y1="220" x2="525" y2="310" stroke="#000000" stroke-width="1.8"/>

  <!-- Transfer Officers -> Stations & Logout -->
  <line x1="1135" y1="700" x2="535" y2="600" stroke="#ea580c" stroke-width="2"/>
  <line x1="1135" y1="710" x2="985" y2="600" stroke="#7c3aed" stroke-width="2"/>
  <line x1="1135" y1="690" x2="525" y2="315" stroke="#000000" stroke-width="1.8"/>

  <!-- ================= DASHED RELATIONSHIPS (<<include>> and <<extend>>) ================= -->

  <!-- Login -> Rate Limiting, Format, Hash (Include) -->
  <line x1="525" y1="180" x2="630" y2="148" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)"/>
  <text x="555" y="152" font-size="8.5" fill="#333333">&lt;&lt;include&gt;&gt;</text>

  <line x1="525" y1="190" x2="625" y2="190" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)"/>
  <text x="560" y="184" font-size="8.5" fill="#333333">&lt;&lt;include&gt;&gt;</text>

  <line x1="525" y1="200" x2="625" y2="232" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)"/>
  <text x="555" y="226" font-size="8.5" fill="#333333">&lt;&lt;include&gt;&gt;</text>

  <!-- Login -> 4 Role-Based Redirections (Extend) -->
  <line x1="410" y1="216" x2="410" y2="444" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#open-arrow)"/>
  <text x="418" y="380" font-size="9" font-weight="bold" fill="#0284c7">&lt;&lt;extend&gt;&gt; [role: 'admin']</text>

  <line x1="495" y1="205" x2="800" y2="445" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#open-arrow)"/>
  <text x="640" y="340" font-size="9" font-weight="bold" fill="#16a34a">&lt;&lt;extend&gt;&gt; [isSupplier()]</text>

  <line x1="390" y1="216" x2="390" y2="574" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#open-arrow)"/>
  <text x="270" y="420" font-size="9" font-weight="bold" fill="#ea580c">&lt;&lt;extend&gt;&gt; [windows_doors]</text>

  <line x1="480" y1="212" x2="820" y2="576" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#open-arrow)"/>
  <text x="670" y="415" font-size="9" font-weight="bold" fill="#7c3aed">&lt;&lt;extend&gt;&gt; [roofing_transfer]</text>

  <!-- Login -> Seeder fallback (Extend) -->
  <line x1="430" y1="216" x2="620" y2="726" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)"/>
  <text x="540" y="520" font-size="8.5" fill="#333333">&lt;&lt;extend&gt;&gt; [Auto-Seed]</text>

</svg>
