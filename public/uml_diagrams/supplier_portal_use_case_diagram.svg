  <g transform="translate(730, 710)">
    <ellipse cx="0" cy="0" rx="90" ry="19" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="#000000">Change Password</text>
