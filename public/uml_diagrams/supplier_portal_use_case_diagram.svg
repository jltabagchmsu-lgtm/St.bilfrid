  <g transform="translate(430, 685)">
    <ellipse cx="0" cy="0" rx="115" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" font-weight="600" fill="#000000">Organization Profile</text>
    <text x="0" y="11" text-anchor="middle" font-size="11" font-weight="600" fill="#000000">&amp; Credentials</text>
