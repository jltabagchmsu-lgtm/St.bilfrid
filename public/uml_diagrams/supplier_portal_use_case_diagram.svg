  <text x="548" y="116" font-size="8.5" fill="#333333">&lt;&lt;include&gt;&gt;</text>
  <line x1="520" y1="135" x2="618" y2="152" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
  <text x="548" y="152" font-size="8.5" fill="#333333">&lt;&lt;include&gt;&gt;</text>

  <!-- Dashboard -> Sales & Metrics -->
  <line x1="545" y1="225" x2="628" y2="225" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
  <text x="562" y="219" font-size="8.5" fill="#333333">&lt;&lt;include&gt;&gt;</text>

  <!-- Dashboard -> Notifications -->
  <line x1="430" y1="251" x2="430" y2="734" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
  <text x="435" y="725" font-size="8.5" fill="#333333">&lt;&lt;include&gt;&gt;</text>

  <!-- Catalog -> Add / Update / Delist -->
  <line x1="545" y1="325" x2="643" y2="310" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
  <text x="572" y="312" font-size="8.5" fill="#333333">&lt;&lt;extend&gt;&gt;</text>
  <line x1="545" y1="340" x2="628" y2="345" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
  <text x="572" y="340" font-size="8.5" fill="#333333">&lt;&lt;extend&gt;&gt;</text>
  <line x1="545" y1="355" x2="643" y2="380" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
  <text x="572" y="375" font-size="8.5" fill="#333333">&lt;&lt;extend&gt;&gt;</text>

  <!-- Orders -> Details / Status / Chat -->
  <line x1="545" y1="455" x2="628" y2="440" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
  <text x="570" y="442" font-size="8.5" fill="#333333">&lt;&lt;include&gt;&gt;</text>
  <line x1="545" y1="470" x2="623" y2="475" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
  <text x="570" y="470" font-size="8.5" fill="#333333">&lt;&lt;extend&gt;&gt;</text>
  <line x1="545" y1="485" x2="628" y2="510" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
  <text x="570" y="505" font-size="8.5" fill="#333333">&lt;&lt;extend&gt;&gt;</text>

  <!-- Inquiries -> Submit Quotation -->
  <line x1="545" y1="585" x2="628" y2="585" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
  <text x="570" y="579" font-size="8.5" fill="#333333">&lt;&lt;extend&gt;&gt;</text>

  <!-- Profile -> Contact Info / Password -->
  <line x1="545" y1="675" x2="638" y2="670" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
  <text x="570" y="667" font-size="8.5" fill="#333333">&lt;&lt;extend&gt;&gt;</text>
  <line x1="545" y1="695" x2="638" y2="708" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
  <text x="570" y="710" font-size="8.5" fill="#333333">&lt;&lt;extend&gt;&gt;</text>

</svg>
