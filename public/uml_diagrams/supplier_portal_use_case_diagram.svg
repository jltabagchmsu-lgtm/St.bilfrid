    <text x="0" y="11" text-anchor="middle" font-size="11" font-weight="600" fill="#000000">Dashboard</text>
  </g>
  <g transform="translate(730, 225)">
    <ellipse cx="0" cy="0" rx="100" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="#000000">Sales &amp; Revenue Metrics</text>
  </g>

  <!-- 3. Product Catalog Management -->
  <g transform="translate(430, 335)">
    <ellipse cx="0" cy="0" rx="115" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" font-weight="600" fill="#000000">Product Catalog</text>
    <text x="0" y="11" text-anchor="middle" font-size="11" font-weight="600" fill="#000000">Management</text>
  </g>
  <g transform="translate(730, 305)">
    <ellipse cx="0" cy="0" rx="85" ry="19" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="#000000">Add New Product</text>
