  <line x1="150" y1="230" x2="315" y2="225" stroke="#000000" stroke-width="1.8" />
  <line x1="150" y1="245" x2="315" y2="335" stroke="#000000" stroke-width="1.8" />
  <line x1="150" y1="260" x2="315" y2="465" stroke="#000000" stroke-width="1.8" />
  <line x1="150" y1="275" x2="315" y2="585" stroke="#000000" stroke-width="1.8" />
  <line x1="150" y1="290" x2="325" y2="685" stroke="#000000" stroke-width="1.8" />

  <!-- ================= SOLID ASSOCIATION LINES (SUPPLIER 2 -> HUBS) ================= -->
  <line x1="150" y1="535" x2="325" y2="130" stroke="#000000" stroke-width="1.8" />
  <line x1="150" y1="550" x2="315" y2="225" stroke="#000000" stroke-width="1.8" />
  <line x1="150" y1="565" x2="315" y2="335" stroke="#000000" stroke-width="1.8" />
  <line x1="150" y1="580" x2="315" y2="465" stroke="#000000" stroke-width="1.8" />
  <line x1="150" y1="595" x2="315" y2="585" stroke="#000000" stroke-width="1.8" />
  <line x1="150" y1="610" x2="325" y2="685" stroke="#000000" stroke-width="1.8" />

