<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000" letter-spacing="1">
    INTEGRATED INVENTORY AND SALES MANAGEMENT SYSTEM
  </text>
  <text x="550" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">
    [ SUPPLIER PORTAL USE CASE DIAGRAM (SUPPLIER 1 &amp; SUPPLIER 2) ]
  </text>

  <!-- System Boundary Box -->
  <rect x="250" y="80" width="810" height="710" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="270" y="105" font-size="13" font-weight="bold" fill="#000000">Supplier Tenant Operations Boundary</text>

  <!-- ================= ACTOR: SUPPLIER 1 ================= -->
  <g transform="translate(90, 200)">
    <circle cx="25" cy="0" r="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="16" x2="25" y2="65" stroke="#000000" stroke-width="2.5"/>
    <line x1="-5" y1="35" x2="55" y2="35" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="0" y2="110" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="50" y2="110" stroke="#000000" stroke-width="2.5"/>
    <text x="25" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">SUPPLIER 1</text>
    <text x="25" y="148" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">(WINDOWS &amp; DOORS)</text>
  </g>

  <!-- ================= ACTOR: SUPPLIER 2 ================= -->
  <g transform="translate(90, 520)">
    <circle cx="25" cy="0" r="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="16" x2="25" y2="65" stroke="#000000" stroke-width="2.5"/>
    <line x1="-5" y1="35" x2="55" y2="35" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="0" y2="110" stroke="#000000" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="50" y2="110" stroke="#000000" stroke-width="2.5"/>
    <text x="25" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">SUPPLIER 2</text>
    <text x="25" y="148" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">(ROOFING SUPPLIES)</text>
  </g>

  <!-- ================= USE CASES ================= -->

  <!-- 1. Authentication -->
  <g transform="translate(420, 130)">
    <ellipse cx="0" cy="0" rx="100" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="600" fill="#000000">Authentication</text>
  </g>
  <g transform="translate(680, 115)">
    <ellipse cx="0" cy="0" rx="60" ry="18" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="#000000">Login</text>
  </g>
  <g transform="translate(680, 155)">
    <ellipse cx="0" cy="0" rx="60" ry="18" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="#000000">Logout</text>
  </g>

  <!-- 2. Supplier Operations Dashboard -->
  <g transform="translate(430, 225)">
    <ellipse cx="0" cy="0" rx="115" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
