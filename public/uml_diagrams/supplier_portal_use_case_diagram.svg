    <ellipse cx="0" cy="0" rx="100" ry="19" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="#000000">Update Stock &amp; Price</text>
  </g>
  <g transform="translate(730, 385)">
    <ellipse cx="0" cy="0" rx="85" ry="19" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="#000000">Delist Product Item</text>
  </g>

  <!-- 4. Purchase Order Fulfillment -->
  <g transform="translate(430, 465)">
    <ellipse cx="0" cy="0" rx="115" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" font-weight="600" fill="#000000">Purchase Order</text>
    <text x="0" y="11" text-anchor="middle" font-size="11" font-weight="600" fill="#000000">Fulfillment</text>
  </g>
