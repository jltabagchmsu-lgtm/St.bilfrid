<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1200" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000" letter-spacing="1">
    INTEGRATED INVENTORY AND SALES MANAGEMENT SYSTEM
  </text>
  <text x="550" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">
    [ UML ACTIVITY DIAGRAM: AUTHENTICATION &amp; ROLE-BASED PORTAL ROUTING ]
  </text>
  <text x="550" y="78" text-anchor="middle" font-size="11" fill="#666666">
    Implementation Reference: App\Http\Controllers\AuthController.php
  </text>

  <!-- Outer Frame -->
  <rect x="40" y="95" width="1020" height="1070" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ================= 1. START NODE ================= -->
  <circle cx="550" cy="135" r="14" fill="#000000"/>
  <text x="550" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#000000">User Submits Credentials at /login</text>

  <!-- Down Line -->
  <line x1="550" y1="149" x2="550" y2="185" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================= 2. RATE LIMITER CHECK ================= -->
  <!-- Decision Diamond 1 -->
  <g transform="translate(550, 225)">
    <polygon points="0,-35 110,0 0,35 -110,0" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" font-size="10.5" font-weight="600" fill="#000000">Attempts &gt; 5 in 60s?</text>
    <text x="0" y="11" text-anchor="middle" font-size="9" fill="#555555">(RateLimiter Check)</text>
  </g>

  <!-- Branch: Yes (Lockout Error) -->
  <line x1="660" y1="225" x2="840" y2="225" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="735" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">[Yes: Throttled]</text>

  <g transform="translate(840, 200)">
    <rect x="0" y="0" width="170" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="85" y="22" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">HTTP 429 Lockout</text>
    <text x="85" y="38" text-anchor="middle" font-size="9" fill="#7f1d1d">Display seconds remaining</text>
  </g>

  <!-- Branch: No (Proceed to Credential Validation) -->
  <line x1="550" y1="260" x2="550" y2="305" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="565" y="285" font-size="10" font-weight="bold" fill="#16a34a">[No]</text>

  <!-- ================= 3. VALIDATE FORMAT ================= -->
  <g transform="translate(420, 310)">
    <rect x="0" y="0" width="260" height="46" rx="6" fill="#f8fafc" stroke="#000000" stroke-width="1.6"/>
    <text x="130" y="20" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">Validate Request Format</text>
    <text x="130" y="36" text-anchor="middle" font-size="9.5" fill="#475569">email: required|email, password: required</text>
  </g>

  <!-- Down Line -->
  <line x1="550" y1="356" x2="550" y2="395" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================= 4. AUTH ATTEMPT (PASSWORD HASH) ================= -->
  <!-- Decision Diamond 2 -->
  <g transform="translate(550, 440)">
    <polygon points="0,-40 125,0 0,40 -125,0" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="-8" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">Auth::attempt()</text>
    <text x="0" y="8" text-anchor="middle" font-size="9.5" fill="#000000">Credentials Valid?</text>
    <text x="0" y="23" text-anchor="middle" font-size="8.5" fill="#555555">(Hash::check password)</text>
  </g>

  <!-- Branch: Invalid (Increment Rate Limiter & Return Error) -->
  <line x1="675" y1="440" x2="840" y2="440" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="745" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">[No: Invalid]</text>

  <g transform="translate(840, 415)">
    <rect x="0" y="0" width="170" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="85" y="20" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#991b1b">RateLimiter::hit(60s)</text>
    <text x="85" y="36" text-anchor="middle" font-size="8.5" fill="#7f1d1d">Flash: "Invalid credentials."</text>
  </g>
  <!-- Line back to login -->
  <path d="M 1010 440 L 1035 440 L 1035 135 L 575 135" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>

  <!-- Branch: Valid (Clear Throttle & Regenerate Session) -->
  <line x1="550" y1="480" x2="550" y2="525" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="565" y="505" font-size="10" font-weight="bold" fill="#16a34a">[Yes: Success]</text>

  <!-- ================= 5. SUCCESS INITIALIZATION ================= -->
  <g transform="translate(400, 530)">
    <rect x="0" y="0" width="300" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="150" y="20" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">1. RateLimiter::clear($throttleKey)</text>
    <text x="150" y="38" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">2. $request-&gt;session()-&gt;regenerate()</text>
  </g>

  <!-- Down Line -->
  <line x1="550" y1="580" x2="550" y2="625" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================= 6. ROLE EVALUATION DECISION ================= -->
  <g transform="translate(550, 675)">
    <polygon points="0,-45 150,0 0,45 -150,0" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="0" y="-12" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Evaluate User Role</text>
    <text x="0" y="5" text-anchor="middle" font-size="9.5" fill="#333333">($user-&gt;role &amp; isSupplier())</text>
    <text x="0" y="22" text-anchor="middle" font-size="8.5" fill="#666666">Determine Target Landing Portal</text>
  </g>

  <!-- ================= 7. FOUR ROLE BRANCHES ================= -->

  <!-- Branch 1: Master Admin (role === 'admin' / default) -->
  <path d="M 400 675 L 170 675 L 170 760" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="665" text-anchor="middle" font-size="10" font-weight="bold" fill="#0284c7">[role: 'admin']</text>

  <!-- Branch 2: Supplier Account ($user->isSupplier() / role: 'supplier') -->
  <path d="M 470 710 L 420 760" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="738" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">[isSupplier()]</text>

  <!-- Branch 3: Windows & Doors Transfer Officer (role: 'windows_doors_transfer') -->
  <path d="M 630 710 L 680 760" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="738" text-anchor="middle" font-size="10" font-weight="bold" fill="#ea580c">[windows_doors]</text>

  <!-- Branch 4: Roofing Transfer Officer (role: 'roofing_transfer') -->
  <path d="M 700 675 L 930 675 L 930 760" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="665" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">[roofing_transfer]</text>

  <!-- ================= 8. LANDING PORTALS (DESTINATION TARGETS) ================= -->

  <!-- Target 1: Master Admin Executive Control -->
  <g transform="translate(65, 765)">
    <rect x="0" y="0" width="210" height="95" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="105" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">MASTER ADMIN PORTAL</text>
    <text x="105" y="42" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0c4a6e">Route: route('dashboard')</text>
    <text x="105" y="60" text-anchor="middle" font-size="9" fill="#334155">• Executive BI Dashboard</text>
    <text x="105" y="74" text-anchor="middle" font-size="9" fill="#334155">• Sales Analytics &amp; BOM DUPA</text>
    <text x="105" y="88" text-anchor="middle" font-size="9" fill="#334155">• Supplier Procurement Hub</text>
  </g>

  <!-- Target 2: Supplier 1 & 2 Management Portal -->
  <g transform="translate(315, 765)">
    <rect x="0" y="0" width="210" height="95" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="105" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">SUPPLIER PORTAL</text>
    <text x="105" y="42" text-anchor="middle" font-size="9.5" font-weight="600" fill="#14532d">Route: route('supplier.dashboard')</text>
    <text x="105" y="60" text-anchor="middle" font-size="9" fill="#334155">• Product Catalog &amp; Pricing</text>
    <text x="105" y="74" text-anchor="middle" font-size="9" fill="#334155">• Purchase Order Fulfillment</text>
    <text x="105" y="88" text-anchor="middle" font-size="9" fill="#334155">• RFQs &amp; Direct Order Messaging</text>
  </g>

  <!-- Target 3: Windows & Doors Transfer Portal -->
  <g transform="translate(575, 765)">
    <rect x="0" y="0" width="210" height="95" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="105" y="24" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c2410c">WINDOWS &amp; DOORS</text>
    <text x="105" y="42" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7c2d12">Route: route('windowsDoors.index')</text>
    <text x="105" y="60" text-anchor="middle" font-size="9" fill="#334155">• Material Stock Dispatch</text>
    <text x="105" y="74" text-anchor="middle" font-size="9" fill="#334155">• Inter-Project Site Transfers</text>
    <text x="105" y="88" text-anchor="middle" font-size="9" fill="#334155">• Print Transfer Vouchers</text>
  </g>

  <!-- Target 4: Roofing Transfer Portal -->
  <g transform="translate(825, 765)">
    <rect x="0" y="0" width="210" height="95" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="105" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">ROOFING TRANSFER</text>
    <text x="105" y="42" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4c1d95">Route: route('roofing.index')</text>
    <text x="105" y="60" text-anchor="middle" font-size="9" fill="#334155">• Roofing Materials Dispatch</text>
    <text x="105" y="74" text-anchor="middle" font-size="9" fill="#334155">• Surplus Stock Reclaim</text>
    <text x="105" y="88" text-anchor="middle" font-size="9" fill="#334155">• Warehouse Restock Receipts</text>
  </g>

  <!-- Lines down to End Node -->
  <line x1="170" y1="860" x2="170" y2="920" stroke="#0284c7" stroke-width="1.8"/>
  <line x1="420" y1="860" x2="420" y2="920" stroke="#16a34a" stroke-width="1.8"/>
  <line x1="680" y1="860" x2="680" y2="920" stroke="#ea580c" stroke-width="1.8"/>
  <line x1="930" y1="860" x2="930" y2="920" stroke="#7c3aed" stroke-width="1.8"/>

  <!-- Join Bar -->
  <line x1="170" y1="920" x2="930" y2="920" stroke="#000000" stroke-width="4"/>
  <line x1="550" y1="920" x2="550" y2="970" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 9. END NODE (SESSION ACTIVE) ================= -->
  <g transform="translate(550, 1010)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="#000000"/>
    <text x="0" y="38" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Authorized User Session Active</text>
    <text x="0" y="54" text-anchor="middle" font-size="9.5" fill="#475569">Access Controlled via Role Middleware (auth, role:admin, role:supplier)</text>
  </g>

</svg>
